name: Job Outputs Demo

on:
  workflow_dispatch:

jobs:

  get-date:
    runs-on: ubuntu-latest

    outputs:
      today_date: ${{ steps.date_step.outputs.today }}

    steps:
      - name: Generate today's date
        id: date_step
        run: echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

  print-date:
    runs-on: ubuntu-latest
    needs: get-date

    steps:
      - name: Print date from previous job
        run: echo "Today's date is ${{ needs.get-date.outputs.today_date }}"
