name: Output-Jobs
on: 
    workflow_dispatch:


jobs:
    get-date:
        runs-on: ubuntu-latest
        
        outputs:
            today_date: ${{ steps.date_steps.output_date }} >>GITHUB_OUTPUT


        steps:
            - name: Generate Todays Date
              id: date_steps
              run: echo "Todays Date is :(date +'%y-%m-%d')"

